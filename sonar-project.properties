# SonarQube Cloud Configuration for Autowasp
# Documentation: https://docs.sonarsource.com/sonarqube-cloud/
#
# This file is committed to the repository with actual project configuration.
# Credentials (SONAR_TOKEN) are provided via environment variables for security.
#
# For local testing/development with different settings, create:
#   sonar-project-local.properties
# This file will override settings here and is gitignored.
#
# ════════════════════════════════════════════════════════════════════════════
# PROJECT IDENTIFICATION
# ════════════════════════════════════════════════════════════════════════════
# These values are committed to the repository for transparency.
# Credentials (tokens) are provided via environment variables, not hardcoded here.

# SonarQube Cloud organization key
# This is the organization slug in SonarQube Cloud
sonar.organization=honk-buzz

# Project key (usually: organization_repository-name)
# This uniquely identifies the project in SonarQube Cloud
sonar.projectKey=brndls_autowasp

# Project name as displayed in SonarQube Cloud
sonar.projectName=Autowasp

# Project version (should match build.gradle.kts version)
sonar.projectVersion=2.2.5

# ════════════════════════════════════════════════════════════════════════════
# SOURCE CODE CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════

# Source directories
sonar.sources=src/main/java

# Test directories
sonar.tests=src/test/java

# Java version
sonar.java.source=21
sonar.java.target=21

# Encoding
sonar.sourceEncoding=UTF-8

# ════════════════════════════════════════════════════════════════════════════
# COVERAGE CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════

# JaCoCo XML report path (generated by ./gradlew jacocoTestReport)
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Exclude UI components from coverage (same as build.gradle.kts)
sonar.coverage.exclusions=\
  **/ExtenderPanelUI*.java,\
  **/checklist/*Table*.java,\
  **/logger/**/*Table*.java,\
  **/http/ContextMenuFactory*.java,\
  **/checklist/ChecklistFetchWorker*.java,\
  **/ProjectWorkspaceFactory*.java,\
  **/Autowasp*.java

# ════════════════════════════════════════════════════════════════════════════
# ANALYSIS EXCLUSIONS
# ════════════════════════════════════════════════════════════════════════════

# Exclude generated files and build artifacts
sonar.exclusions=\
  **/build/**,\
  **/bin/**,\
  **/.gradle/**,\
  **/.legacy-backup/**

# ════════════════════════════════════════════════════════════════════════════
# ADDITIONAL SETTINGS
# ════════════════════════════════════════════════════════════════════════════

# SCM provider
sonar.scm.provider=git

# Links
sonar.links.homepage=https://github.com/brndls/autowasp
sonar.links.ci=https://github.com/brndls/autowasp/actions
sonar.links.issue=https://github.com/brndls/autowasp/issues
sonar.links.scm=https://github.com/brndls/autowasp
